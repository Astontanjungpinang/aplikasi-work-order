<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Work Order Internal</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4 md:p-8">

  <script>
    // URL GOOGLE APPS SCRIPT
    const API_URL = "https://script.google.com/macros/s/AKfycbweuiYxel5oxEK2gSkwHb825vMc2KKdL1XABmIotAQSutRZ0J_KX--CAEVCtuyDk-3ZtA/exec";
    
    // PASSWORD ADMIN UNTUK AKSI STATUS
    const ADMIN_PASSWORD = "admin2026";
  </script>

  <div class="max-w-7xl mx-auto space-y-8">
    <h1 class="text-3xl font-bold text-center text-gray-800">Sistem Work Order Internal</h1>

    <!-- Form Input Work Order -->
    <div class="bg-white p-6 rounded-lg shadow-md">
      <h2 class="text-xl font-semibold mb-4 text-gray-700">Buat Work Order Baru</h2>
      <form id="woForm" onsubmit="submitWO(event)" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700">Nama Pelapor</label>
            <input type="text" id="pelapor" required class="w-full mt-1 p-2 border rounded-md">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700">Lokasi / Ruangan</label>
            <input type="text" id="lokasi" required class="w-full mt-1 p-2 border rounded-md">
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Deskripsi Masalah / Pekerjaan</label>
          <textarea id="deskripsi" required class="w-full mt-1 p-2 border rounded-md" rows="3"></textarea>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Tingkat Prioritas</label>
          <select id="prioritas" class="w-full mt-1 p-2 border rounded-md">
            <option value="Rendah">Rendah</option>
            <option value="Sedang">Sedang</option>
            <option value="Tinggi">Tinggi</option>
          </select>
        </div>
        <button type="submit" id="btnSubmit" class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700 font-medium">Kirim Work Order</button>
      </form>
    </div>

    <!-- Dashboard Status Admin & Fitur Laporan -->
    <div class="bg-white p-6 rounded-lg shadow-md">
      <div class="flex flex-col md:flex-row justify-between items-center mb-4 gap-2">
        <h2 class="text-xl font-semibold text-gray-700">Daftar Work Order</h2>
        <div class="flex space-x-2">
          <button onclick="openReportModal()" class="bg-green-600 text-white px-3 py-1.5 rounded hover:bg-green-700 text-sm font-medium">
            📄 Cetak Laporan Bulanan
          </button>
          <button onclick="loadData()" class="bg-gray-200 text-gray-700 px-3 py-1.5 rounded hover:bg-gray-300 text-sm font-medium">
            Refresh Data
          </button>
        </div>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-gray-50 border-b">
              <th class="p-3 text-sm font-semibold">ID</th>
              <th class="p-3 text-sm font-semibold">Tanggal</th>
              <th class="p-3 text-sm font-semibold">Pelapor</th>
              <th class="p-3 text-sm font-semibold">Lokasi</th>
              <th class="p-3 text-sm font-semibold">Deskripsi</th>
              <th class="p-3 text-sm font-semibold">Prioritas</th>
              <th class="p-3 text-sm font-semibold">Status</th>
              <th class="p-3 text-sm font-semibold">PIC Teknisi</th>
              <th class="p-3 text-sm font-semibold">Time Solving</th>
              <th class="p-3 text-sm font-semibold">Remark</th>
              <th class="p-3 text-sm font-semibold">Aksi Admin</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr><td colspan="11" class="text-center p-4">Memuat data...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal Filter Laporan Bulanan (Tanpa Filter Status Awal) -->
  <div id="reportModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-lg p-6 max-w-md w-full space-y-4 shadow-xl">
      <h3 class="text-lg font-bold text-gray-800 border-b pb-2">Cetak Laporan Bulanan Work Order</h3>
      <div>
        <label class="block text-sm font-medium text-gray-700">Pilih Bulan & Tahun</label>
        <input type="month" id="reportMonth" class="w-full mt-1 p-2 border rounded-md">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Nama Admin / Pembuat Laporan</label>
        <input type="text" id="adminName" placeholder="Contoh: Budi Maintenance" class="w-full mt-1 p-2 border rounded-md">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Nama Atasan / Manager</label>
        <input type="text" id="managerName" placeholder="Contoh: Manager Operasional" class="w-full mt-1 p-2 border rounded-md">
      </div>
      <div class="flex justify-end space-x-2 pt-3 border-t">
        <button onclick="closeReportModal()" class="px-4 py-2 bg-gray-300 text-gray-700 rounded hover:bg-gray-400 text-sm font-medium">Batal</button>
        <button onclick="generateReport()" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 text-sm font-medium">Buka & Cetak Laporan</button>
      </div>
    </div>
  </div>

  <script>
    let globalWOData = [];

    async function loadData() {
      const tbody = document.getElementById("tableBody");
      if (!tbody) return;
      tbody.innerHTML = '<tr><td colspan="11" class="text-center p-4">Memuat data...</td></tr>';
      
      try {
        const res = await fetch(API_URL + "?t=" + new Date().getTime());
        const data = await res.json();
        
        if (!Array.isArray(data) || data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="11" class="text-center p-4 text-gray-500">Belum ada data Work Order.</td></tr>';
          globalWOData = [];
          return;
        }

        globalWOData = data;
        renderTableData(data);
      } catch (err) {
        console.error("Error loadData:", err);
        tbody.innerHTML = '<tr><td colspan="11" class="text-center p-4 text-red-500">Gagal memuat data. Klik Refresh Data.</td></tr>';
      }
    }

    function renderTableData(data) {
      const tbody = document.getElementById("tableBody");
      tbody.innerHTML = "";
      
      const reversed = [...data].reverse();
      reversed.forEach(row => {
        const tr = document.createElement("tr");
        tr.className = "border-b hover:bg-gray-50";

        let badgeBg = "bg-gray-500";
        const st = (row.status || "Pending").trim();
        if (st === "In Progress") badgeBg = "bg-yellow-500";
        if (st === "Hold") badgeBg = "bg-orange-600";
        if (st === "Completed") badgeBg = "bg-green-600";

        tr.innerHTML = 
          '<td class="p-3 text-sm font-mono">' + (row.id || '-') + '</td>' +
          '<td class="p-3 text-sm">' + (row.tanggal || '-') + '</td>' +
          '<td class="p-3 text-sm">' + (row.pelapor || '-') + '</td>' +
          '<td class="p-3 text-sm">' + (row.lokasi || '-') + '</td>' +
          '<td class="p-3 text-sm">' + (row.deskripsi || '-') + '</td>' +
          '<td class="p-3 text-sm font-semibold">' + (row.prioritas || '-') + '</td>' +
          '<td class="p-3 text-sm"><span class="px-2 py-1 rounded text-xs text-white ' + badgeBg + '">' + st + '</span></td>' +
          '<td class="p-3 text-sm font-medium text-blue-600">' + (row.pic || '-') + '</td>' +
          '<td class="p-3 text-sm text-purple-600 font-medium">' + (row.timeSolving || '-') + '</td>' +
          '<td class="p-3 text-sm text-gray-600 italic">' + (row.remark || '-') + '</td>' +
          '<td class="p-3 text-sm flex gap-1">' +
            '<button onclick="updateStatus(\'' + row.id + '\', \'In Progress\', \'' + (row.pic || '') + '\', \'' + (row.timeSolving || '') + '\', \'' + (row.remark || '') + '\')" class="bg-yellow-500 text-white px-2 py-1 rounded text-xs hover:bg-yellow-600">Proses</button>' +
            '<button onclick="updateStatus(\'' + row.id + '\', \'Hold\', \'' + (row.pic || '') + '\', \'' + (row.timeSolving || '') + '\', \'' + (row.remark || '') + '\')" class="bg-orange-600 text-white px-2 py-1 rounded text-xs hover:bg-orange-700">Hold</button>' +
            '<button onclick="updateStatus(\'' + row.id + '\', \'Completed\', \'' + (row.pic || '') + '\', \'' + (row.timeSolving || '') + '\', \'' + (row.remark || '') + '\')" class="bg-green-600 text-white px-2 py-1 rounded text-xs hover:bg-green-700">Selesai</button>' +
          '</td>';

        tbody.appendChild(tr);
      });
    }

    async function submitWO(e) {
      e.preventDefault();
      
      const btn = document.getElementById("btnSubmit");
      btn.innerText = "Mengirim...";
      btn.disabled = true;

      const payload = {
        action: "create",
        pelapor: document.getElementById("pelapor").value,
        lokasi: document.getElementById("lokasi").value,
        deskripsi: document.getElementById("deskripsi").value,
        prioritas: document.getElementById("prioritas").value
      };

      try {
        await fetch(API_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: new URLSearchParams(payload)
        });

        document.getElementById("woForm").reset();
        alert("Work Order berhasil dikirim!");
        setTimeout(loadData, 2000);
      } catch (err) {
        alert("Gagal mengirim Work Order: " + err);
      } finally {
        btn.innerText = "Kirim Work Order";
        btn.disabled = false;
      }
    }

    async function updateStatus(id, newStatus, currentPic, currentTimeSolving, currentRemark) {
      const inputPassword = prompt('Aksi Admin [Ubah Status ke "' + newStatus + '"]: Masukkan Password Admin:');
      if (inputPassword === null) return;

      if (inputPassword !== ADMIN_PASSWORD) {
        alert("Password Admin Salah! Akses ditolak.");
        return;
      }

      let inputPic = currentPic || '-';
      let inputTime = currentTimeSolving || '-';
      let inputRemark = currentRemark || '-';

      if (newStatus === "In Progress") {
        const picVal = prompt('Masukkan Nama PIC / Teknisi yang mengerjakan:', currentPic !== '-' ? currentPic : '');
        if (picVal === null) return;
        inputPic = picVal || '-';
      } 
      else if (newStatus === "Hold") {
        const remarkVal = prompt('Masukkan Remark Permasalahan / Alasan Hold:', currentRemark !== '-' ? currentRemark : '');
        if (remarkVal === null) return;
        inputRemark = remarkVal || '-';
      } 
      else if (newStatus === "Completed") {
        const timeVal = prompt('Masukkan Waktu Penyelesaian (Time Solving), misal "2 Jam" / "45 Menit":', currentTimeSolving !== '-' ? currentTimeSolving : '');
        if (timeVal === null) return;
        inputTime = timeVal || '-';
      }

      if (!confirm('Konfirmasi ubah status Work Order ' + id + ' menjadi "' + newStatus + '"?')) return;

      try {
        await fetch(API_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: new URLSearchParams({ 
            action: "updateStatus", 
            id: id, 
            status: newStatus,
            pic: inputPic,
            timeSolving: inputTime,
            remark: inputRemark
          })
        });

        alert("Status Work Order berhasil diperbarui!");
        setTimeout(loadData, 2000);
      } catch (err) {
        alert("Gagal memperbarui status: " + err);
      }
    }

    function openReportModal() {
      const now = new Date();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      document.getElementById("reportMonth").value = `${now.getFullYear()}-${m}`;
      document.getElementById("reportModal").classList.remove("hidden");
    }

    function closeReportModal() {
      document.getElementById("reportModal").classList.add("hidden");
    }

    function generateReport() {
      const monthVal = document.getElementById("reportMonth").value;
      const adminName = document.getElementById("adminName").value || "Admin Maintenance";
      const managerName = document.getElementById("managerName").value || "Head Department / Manager";

      if (!monthVal) {
        alert("Pilih bulan dan tahun terlebih dahulu.");
        return;
      }

      const [year, month] = monthVal.split('-');
      
      const monthlyData = globalWOData.filter(row => {
        if (!row.tanggal) return false;
        const d = new Date(row.tanggal);
        if (isNaN(d.getTime())) return true;
        return d.getFullYear() == parseInt(year) && (d.getMonth() + 1) == parseInt(month);
      });

      const monthNames = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
      const periodTitle = monthNames[parseInt(month) - 1] + " " + year;

      const rawJSONData = JSON.stringify(monthlyData).replace(/'/g, "\\'").replace(/"/g, '"');

      const reportHTML = `
        <!DOCTYPE html>
        <html>
        <head>
          <title>Laporan Work Order - ${periodTitle}</title>
          <style>
            body { font-family: Arial, sans-serif; padding: 20px; color: #333; }
            h1, h2, h3 { margin: 4px 0; }
            .kpi-container { display: flex; gap: 10px; margin: 15px 0; }
            .kpi-card { 
              flex: 1; border: 1px solid #ccc; padding: 10px; border-radius: 6px; 
              text-align: center; background: #f9f9f9; cursor: pointer; transition: all 0.2s;
              user-select: none;
            }
            .kpi-card:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
            .kpi-card.active { border: 2px solid #2563eb; background: #eff6ff; }
            .kpi-card h4 { margin: 0; color: #666; font-size: 11px; pointer-events: none; }
            .kpi-card p { margin: 4px 0 0 0; font-size: 18px; font-weight: bold; pointer-events: none; }
            table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 10px; }
            th { background-color: #f2f2f2; padding: 6px; border-bottom: 2px solid #ccc; text-align: left; }
            .signature-area { margin-top: 35px; display: flex; justify-content: space-between; page-break-inside: avoid; }
            .sig-box { width: 40%; text-align: center; }
            .btn-print { background: #2563eb; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-size: 14px; margin-bottom: 15px; }
            @media print { 
              .btn-print { display: none; }
              .kpi-card { cursor: default; transform: none !important; box-shadow: none !important; }
              .kpi-card.active { border: 1px solid #ccc !important; background: #f9f9f9 !important; }
            }
          </style>
        </head>
        <body>
          <button class="btn-print" onclick="window.print()">🖨️ Cetak / Simpan PDF</button>
          
          <div style="border-bottom: 2px solid #333; padding-bottom: 8px; margin-bottom: 15px;">
            <h1>LAPORAN REKAPITULASI WORK ORDER</h1>
            <h3>Periode: ${periodTitle}</h3>
            <h4 id="filterTitleLabel" style="color: #2563eb; margin-top: 4px;">Kriteria Filter: Semua Status</h4>
          </div>

          <div class="kpi-container">
            <div class="kpi-card active" id="card-ALL" onclick="applyFilter('ALL')">
              <h4>TOTAL WO BULAN INI</h4>
              <p id="cnt-total">0</p>
            </div>
            <div class="kpi-card" id="card-Completed" onclick="applyFilter('Completed')">
              <h4>SELESAI</h4>
              <p style="color: green;" id="cnt-completed">0</p>
            </div>
            <div class="kpi-card" id="card-In Progress" onclick="applyFilter('In Progress')">
              <h4>PROSES</h4>
              <p style="color: #d97706;" id="cnt-progress">0</p>
            </div>
            <div class="kpi-card" id="card-Hold" onclick="applyFilter('Hold')">
              <h4>HOLD</h4>
              <p style="color: #dc2626;" id="cnt-hold">0</p>
            </div>
            <div class="kpi-card" id="card-Pending" onclick="applyFilter('Pending')">
              <h4>PENDING</h4>
              <p style="color: gray;" id="cnt-pending">0</p>
            </div>
            <div class="kpi-card" style="cursor: default;">
              <h4>% SELESAI</h4>
              <p style="color: blue;" id="cnt-rate">0%</p>
            </div>
          </div>

          <h3>Daftar Detail Pekerjaan Terfilter</h3>
          <table>
            <thead>
              <tr>
                <th>No</th>
                <th>ID Work Order</th>
                <th>Tanggal</th>
                <th>Pelapor</th>
                <th>Lokasi</th>
                <th>Deskripsi</th>
                <th>Prioritas</th>
                <th>Status</th>
                <th>PIC Teknisi</th>
                <th>Time Solving</th>
                <th>Remark</th>
              </tr>
            </thead>
            <tbody id="reportTableBody">
            </tbody>
          </table>

          <div class="signature-area">
            <div class="sig-box">
              <p>Dibuat Oleh,</p><br><br><br>
              <p><b><u>${adminName}</u></b><br>Admin Maintenance</p>
            </div>
            <div class="sig-box">
              <p>Disetujui Oleh,</p><br><br><br>
              <p><b><u>${managerName}</u></b><br>Manager / Head Department</p>
            </div>
          </div>

          <script>
            const monthlyWOData = JSON.parse('${rawJSONData}');

            function initReport() {
              const totalWO = monthlyWOData.length;
              const completedWO = monthlyWOData.filter(r => (r.status || '').trim() === 'Completed').length;
              const progressWO = monthlyWOData.filter(r => (r.status || '').trim() === 'In Progress').length;
              const holdWO = monthlyWOData.filter(r => (r.status || '').trim() === 'Hold').length;
              const pendingWO = monthlyWOData.filter(r => (r.status || '').trim() === 'Pending' || !r.status).length;
              const completionRate = totalWO > 0 ? ((completedWO / totalWO) * 100).toFixed(1) : 0;

              document.getElementById('cnt-total').innerText = totalWO;
              document.getElementById('cnt-completed').innerText = completedWO;
              document.getElementById('cnt-progress').innerText = progressWO;
              document.getElementById('cnt-hold').innerText = holdWO;
              document.getElementById('cnt-pending').innerText = pendingWO;
              document.getElementById('cnt-rate').innerText = completionRate + '%';

              applyFilter('ALL');
            }

            function applyFilter(filterType) {
              const cards = document.querySelectorAll('.kpi-card');
              cards.forEach(c => c.classList.remove('active'));
              
              const activeCard = document.getElementById('card
